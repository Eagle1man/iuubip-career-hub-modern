# =============================================================================
#  Центр карьеры Южного университета (ИУБиП) — nginx для VPS
#  Путь на сервере: /etc/nginx/sites-available/career.iubip.ru
#  Включить:  ln -s /etc/nginx/sites-available/career.iubip.ru /etc/nginx/sites-enabled/
#             nginx -t && systemctl reload nginx
#  HTTPS:     certbot --nginx -d career.iubip.ru
#  Файлы сайта: /var/www/career-hub/index.html
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name career.iubip.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name career.iubip.ru;

    ssl_certificate     /etc/letsencrypt/live/career.iubip.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/career.iubip.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/career-hub;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    # --- Заголовки безопасности (одинаковые с _headers для Cloudflare) --------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.hh.ru; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;

    # --- Сжатие ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/html text/css application/javascript application/json image/svg+xml;

    # --- Кэширование ----------------------------------------------------------
    # expires не сбрасывает наследование add_header, поэтому заголовки выше
    # продолжают действовать во всех location.
    location = /index.html {
        expires -1;              # Cache-Control: no-cache — подборка обновляется
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 30d;
    }

    # --- Служебное не отдаём наружу ------------------------------------------
    location = /_headers { deny all; }
    location = /nginx.conf { deny all; }
    location ^~ /tools/ { deny all; }
    location ^~ /tests/ { deny all; }
    location ~ /\.(git|github|gitignore) { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/career-hub.access.log;
    error_log  /var/log/nginx/career-hub.error.log warn;
}
