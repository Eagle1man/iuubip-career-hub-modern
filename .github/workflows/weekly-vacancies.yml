name: Weekly vacancies refresh

# Каждый понедельник утром парсер ищет свежие вакансии Ростовской области
# на «Работе России» и обновляет подборку на сайте. Вручную — кнопка Run workflow.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update vacancies from trudvsem.ru
        run: python tools/update_vacancies.py
      - name: Check that the page is still valid
        run: npm install --no-fund --no-audit && npm test
      - name: Commit and push if changed
        run: |
          git config user.name "career-bot"
          git config user.email "career@iubip.ru"
          git add index.html
          git diff --cached --quiet && echo "no changes" || (git commit -m "Weekly vacancies refresh" && git push)
